# Stack de produção para deploy no Coolify (build pack: dockercompose).
#
# Diferente do docker-compose.prod.yml, que assume uma VPS limpa onde o nginx
# deste projeto é dono das portas 80/443 e o certbot roda na mão. No Coolify o
# Traefik já ocupa 80/443 e emite os certificados, então aqui:
#   - nenhum serviço publica portas no host (só `expose`);
#   - o nginx de borda usa infra/nginx/coolify.conf (sem 443, sem certificado);
#   - não há `container_name` fixo — o Coolify sufixa os nomes por deploy e um
#     nome fixo colide entre stacks.
#
# O domínio é atribuído ao serviço `nginx` pelo campo docker_compose_domains da
# aplicação no Coolify (não por variável de ambiente aqui).

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: guarus_energy
      POSTGRES_USER: ${DB_USER:-guarus}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-guarus} -d guarus_energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sincroniza o schema antes da API subir.
  #
  # Reusa o estágio `builder` do backend de propósito: a imagem final roda
  # `npm ci --omit=dev` e copia só `dist/`, então nela faltam o drizzle.config.ts
  # e o src/config/schema.ts que o drizzle-kit precisa ler — `db:push` falharia.
  #
  # ATENÇÃO: `--force` aplica as alterações sem confirmação interativa (sem ele o
  # container trava esperando input e o deploy nunca termina). Em base nova isso é
  # inofensivo, mas numa alteração destrutiva de schema ele derruba a coluna sem
  # perguntar. Antes de mudar o schema com dados de faturamento em produção,
  # gere migration versionada (`db:generate` + `db:migrate`) em vez de push.
  migrate:
    build:
      context: ./backend
      target: builder
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-guarus}:${DB_PASSWORD}@postgres:5432/guarus_energy
      # db:push só precisa de DATABASE_URL, mas o db:seed manual importa
      # src/config/env.ts, que valida JWT_SECRET (min 32) e INGEST_API_KEY (min 16)
      # antes de qualquer coisa — sem eles o seed morre no boot.
      - JWT_SECRET=${JWT_SECRET}
      - INGEST_API_KEY=${INGEST_API_KEY}
      # Interruptor do seed. O seed NÃO é idempotente — repopularia a cada deploy.
      # Para popular o banco: setar RUN_SEED=1, deployar, e voltar para 0 em seguida.
      - RUN_SEED=${RUN_SEED:-0}
      # Troca de senha de um usuário existente. A API não tem rota para isso e o
      # seed grava credenciais que estão publicadas no README. Preencher as duas
      # variáveis no painel, deployar, e limpar SET_PASSWORD_VALUE em seguida.
      - SET_PASSWORD_EMAIL=${SET_PASSWORD_EMAIL:-}
      - SET_PASSWORD_VALUE=${SET_PASSWORD_VALUE:-}
    command:
      - sh
      - -c
      - |
        npm run db:push -- --force
        if [ "$$RUN_SEED" = "1" ]; then
          echo "[migrate] RUN_SEED=1 — populando o banco"
          # O seed é opcional e não idempotente: num banco já populado ele falha
          # com violação de unicidade. Isso NÃO pode derrubar o deploy — se o
          # migrate sai com erro, a api não sobe (service_completed_successfully)
          # e a stack inteira fica fora do ar. Só o db:push acima é obrigatório.
          npm run db:seed || echo "[migrate] seed falhou (banco provavelmente já populado) — seguindo"
        else
          echo "[migrate] RUN_SEED=$$RUN_SEED — seed ignorado"
        fi
        if [ -n "$$SET_PASSWORD_EMAIL" ] && [ -n "$$SET_PASSWORD_VALUE" ]; then
          npm run set-password || echo "[migrate] troca de senha falhou — seguindo"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-guarus}:${DB_PASSWORD}@postgres:5432/guarus_energy
      - JWT_SECRET=${JWT_SECRET}
      - INGEST_API_KEY=${INGEST_API_KEY}
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Fuso do shopping. Sem isto o container roda em UTC e o mês de faturamento
      # começava às 21h do último dia do mês anterior, em horário de Brasília.
      - TZ=America/Sao_Paulo
      - FUSO_FATURAMENTO=America/Sao_Paulo
      # Acima desta lacuna de coleta o fechamento trava em 'requer_revisao' em vez
      # de emitir valor sobre um período que se sabe incompleto.
      - LACUNA_MAX_MIN=${LACUNA_MAX_MIN:-30}
      - AGENT_WS_URL=${AGENT_WS_URL:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ./infra/nginx
    expose:
      - "80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
