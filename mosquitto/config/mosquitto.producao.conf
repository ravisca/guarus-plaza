# Broker do servidor do shopping.
#
# Por que isto importa mais aqui que num broker comum: o `konect/+/readings` é a
# origem do número que vira fatura. Publicar uma leitura forjada nesse tópico
# altera o consumo atribuído a uma loja — e a cobrança que o lojista recebe.
#
# A configuração anterior era o arquivo inteiro em duas linhas:
#
#     listener 1883
#     allow_anonymous true
#
# Sem autenticação, sem ACL, sem TLS, e com o firewall do Windows desligado
# (SEC-04). Qualquer máquina da rede do shopping podia publicar.
#
# ── Instalação ───────────────────────────────────────────────────────────────
#
#  1. Criar as credenciais (o -c cria o arquivo; use-o só na primeira vez):
#
#       mosquitto_passwd -c C:\GuarusPlaza\mosquitto\passwd coletor
#       mosquitto_passwd    C:\GuarusPlaza\mosquitto\passwd agent
#
#  2. Copiar este arquivo e o `aclfile` para `C:\GuarusPlaza\mosquitto\`,
#     ajustando os caminhos abaixo se a instalação estiver em outro lugar.
#
#  3. Preencher no coletor e no agent (variáveis de ambiente do serviço NSSM):
#
#       MQTT_USER / MQTT_PASS
#
#  4. Reiniciar os três serviços, na ordem: mosquitto, agent, collector.
#
#  O arquivo `passwd` NÃO é versionado — o repositório é público.

# Só loopback. O coletor e o agent rodam na mesma máquina; ninguém mais precisa
# alcançar o broker. Esta linha sozinha já fecha a porta para a rede do shopping.
listener 1883 127.0.0.1

allow_anonymous false
password_file C:\GuarusPlaza\mosquitto\passwd
acl_file C:\GuarusPlaza\mosquitto\aclfile

# Uma leitura tem algumas centenas de bytes. Recusar payload grande evita que o
# broker vire alvo de consumo de memória.
message_size_limit 8192

persistence true
persistence_location C:\GuarusPlaza\mosquitto\data\

log_dest file C:\GuarusPlaza\logs\mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
