# Broker de DESENVOLVIMENTO (docker compose da raiz).
#
# Escuta em 0.0.0.0 porque, dentro do container, é assim que o agent alcança o
# broker pela rede do Docker. O que impede a exposição é a publicação da porta,
# que no `docker-compose.yml` está presa a 127.0.0.1 — de fora da máquina não se
# chega aqui.
#
# ─────────────────────────────────────────────────────────────────────────────
# NÃO USE ESTE ARQUIVO NO SERVIDOR DO SHOPPING.
#
# Lá o broker roda nativo (ver docs/INSTALACAO.md) e precisa de autenticação:
# qualquer um que publique em `konect/+/readings` altera o consumo atribuído a
# uma loja — ou seja, altera a fatura. Use `mosquitto.producao.conf`.
# ─────────────────────────────────────────────────────────────────────────────

listener 1883
allow_anonymous true

# Não aceita payload maior que o necessário para uma leitura.
message_size_limit 8192
