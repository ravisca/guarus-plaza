# Nginx de borda para deploy no Coolify.
#
# Diferenças em relação ao default.conf (deploy em VPS limpa):
#   - sem bloco `listen 443` e sem certificados: o TLS é terminado pelo Traefik
#     do Coolify, que já cuida do Let's Encrypt.
#   - sem server_name fixo: o domínio é definido no Coolify, não aqui.
#   - este container não publica portas no host; só o Traefik fala com ele.
#
# Ele existe porque o frontend usa baseURL relativo ('/api'), então frontend e
# API precisam ser servidos na mesma origem.

# Preserva o protocolo original informado pelo Traefik; cai no $scheme interno
# quando o header não vier.
map $http_x_forwarded_proto $guarus_fwd_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Não anunciar a versão do nginx para quem estiver catalogando alvos.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Cabeçalhos de segurança. `always` para valerem também nas respostas de
    # erro, que é justamente onde costumam faltar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # A aplicação não carrega script de terceiros: dá para ser restritivo. O
    # 'unsafe-inline' em style- é exigido pelo Recharts, que injeta estilo inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Resolve os upstreams em tempo de request, não no boot.
    #
    # Com "proxy_pass http://api:3000" literal, o nginx resolve o nome ao iniciar
    # e ABORTA com "host not found in upstream" se o container ainda não existe.
    # Resultado: um problema na API derrubava também o nginx, e o Traefik passava
    # a devolver 503 para o site inteiro — inclusive para o frontend, que estava
    # perfeitamente saudável.
    #
    # 127.0.0.11 é o DNS embutido do Docker. Usando uma variável no proxy_pass, o
    # nginx sobe mesmo com o upstream ausente e devolve 502 apenas na rota afetada.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $upstream_frontend frontend;
    set $upstream_api api;

    location / {
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $guarus_fwd_proto;
    }

    location /api/ {
        proxy_pass http://$upstream_api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $guarus_fwd_proto;
    }

    # Health check da API (Fastify expõe GET /health fora do prefixo /api).
    location = /health {
        proxy_pass http://$upstream_api:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
