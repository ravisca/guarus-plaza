# Nginx de borda para deploy no Coolify.
#
# Diferenças em relação ao default.conf (deploy em VPS limpa):
#   - sem bloco `listen 443` e sem certificados: o TLS é terminado pelo Traefik
#     do Coolify, que já cuida do Let's Encrypt.
#   - sem server_name fixo: o domínio é definido no Coolify, não aqui.
#   - este container não publica portas no host; só o Traefik fala com ele.
#
# Ele existe porque o frontend usa baseURL relativo ('/api'), então frontend e
# API precisam ser servidos na mesma origem.

# Preserva o protocolo original informado pelo Traefik; cai no $scheme interno
# quando o header não vier.
map $http_x_forwarded_proto $guarus_fwd_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $guarus_fwd_proto;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $guarus_fwd_proto;
    }

    # Health check da API (Fastify expõe GET /health fora do prefixo /api).
    location = /health {
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
