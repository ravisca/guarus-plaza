services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: guarus-postgres
    environment:
      POSTGRES_DB: guarus_energy
      POSTGRES_USER: guarus
      POSTGRES_PASSWORD: guarus123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: guarus-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: guarus-agent
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
      - API_KEY=guarus-local-agent-2026
      - LOCAL_PORT=9100
    ports:
      - "9100:9100"
      - "9200:9200"
    depends_on:
      - mosquitto
    volumes:
      - ./agent/queue:/app/queue
    restart: unless-stopped

volumes:
  pgdata:
