services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: guarus-postgres
    environment:
      POSTGRES_DB: guarus_energy
      POSTGRES_USER: guarus
      POSTGRES_PASSWORD: guarus123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: guarus-mosquitto
    ports:
      # Só loopback. Publicado em 0.0.0.0, este broker aceitava conexão anônima
      # de qualquer máquina da rede — e quem publica em `konect/+/readings`
      # altera o consumo que vira fatura (SEC-03).
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: guarus-agent
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
      # Sem valor no arquivo. A chave que estava escrita aqui está publicada num
      # repositório público (SEC-02). Defina AGENT_API_KEY no `.env` da raiz — o
      # `?err` faz o compose recusar subir sem ela, em vez de usar um default
      # silencioso.
      - API_KEY=${AGENT_API_KEY:?defina AGENT_API_KEY no .env (use o mesmo valor na VPS)}
      - LOCAL_PORT=9100
      - WS_PORT=9200
    ports:
      # Só loopback: em ambiente de desenvolvimento não há por que expor o
      # buffer de leituras e o WebSocket do agent para a rede inteira.
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9200:9200"
    depends_on:
      - mosquitto
    volumes:
      - ./agent/queue:/app/queue
    restart: unless-stopped

volumes:
  pgdata:
